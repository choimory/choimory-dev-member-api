spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false

logging:
  level:
    root: error
    dev.choimory: info
    org:hibernate.SQL: error

# CORS 허용 Origin. 프론트 주소(스킴, 포트 포함)
cors:
  allowed-origins:
    - https://choimory.dev

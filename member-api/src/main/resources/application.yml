server:
    port: 8080

management:
    # 앱 포트(8080)와 분리해 Gateway를 통해 외부로 노출되지 않게 한다.
    server:
        port: 8081
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            probes:
                enabled: true
    health:
        # Elasticsearch를 쓰지 않아 health가 DOWN으로 집계되는 것을 막는다.
        elasticsearch:
            enabled: false

spring:
    application:
        name: choimory-dev-member-api

    profiles:
        include: datasource, jwt, redis
        group:
            default: prod, flyway
            prod: prod, flyway
            stg: stg, flyway
            dev: dev, flyway
            local: local, flyway

    jpa:
        open-in-view: false
        show-sql: false
        generate-ddl: false
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                show_sql: false
                format_sql: false

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true

logging:
  level:
    root: info
    dev.choimory: debug
    org.hibernate.SQL: info

# CORS 허용 Origin. 프론트 주소(스킴, 포트 포함)
cors:
  allowed-origins:
    - http://localhost:3000
    - https://dev.choimory.dev
